<div class="profile-page">

    <div class="profile-card">

        <div class="profile-header">

            <img
              [src]="user.image || 'img/s-user.png'">

            <h2>{{user.fullName}}</h2>

            <span>{{user.role}}</span>

        </div>

        <div class="profile-body">

            <div class="info-row">
                <span>Employee No</span>
                <strong>{{user.employeeNo}}</strong>
            </div>

            <div class="info-row">
                <span>Username</span>
                <strong>{{user.username}}</strong>
            </div>

            <div class="info-row">
                <span>Email</span>
                <strong>{{user.email}}</strong>
            </div>

            <div class="info-row">
                <span>Phone</span>
                <strong>{{user.phone}}</strong>
            </div>

            <div class="info-row">
                <span>Gender</span>
                <strong>{{user.gender}}</strong>
            </div>

            <div class="info-row">
                <span>Assigned Block</span>
                <strong>{{user.blockName}}</strong>
            </div>

            <div class="info-row">
                <span>Institution</span>
                <strong>{{user.institution}}</strong>
            </div>

        </div>

        <div class="profile-footer">

            <button
              class="edit-btn"
              (click)="editProfile()">

                <i class="fas fa-edit"></i>

                Edit Profile

            </button>

        </div>

    </div>

</div>

<div class="modal-overlay"
     *ngIf="showEditModal">

    <div class="modal-card">

        <div class="modal-header">

            <h3>Edit Profile</h3>

            <button
              (click)="showEditModal=false">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Full Name</label>

                <input
                  [(ngModel)]="user.fullName">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                  [(ngModel)]="user.email">

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input
                  [(ngModel)]="user.phone">

            </div>

            <div class="form-group">

                <label>Gender</label>

                <select
                  [(ngModel)]="user.gender">

                    <option>Male</option>
                    <option>Female</option>

                </select>

            </div>

            <div class="form-group">

                <label>Profile Image</label>

                <input
                  [(ngModel)]="user.image">

            </div>

        </div>

        <div class="modal-footer">

            <button
              class="cancel-btn"
              (click)="showEditModal=false">

                Cancel

            </button>

            <button
              class="save-btn"
              (click)="saveProfile()">

                Update Profile

            </button>

        </div>

    </div>

</div>
