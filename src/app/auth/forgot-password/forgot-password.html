<div class="forgot-page">

  <div class="bg-overlay"></div>

  <div class="forgot-card">

    <div class="logo-wrap">

      <img
        src="img/logo.png"
        alt="IRIFAMS"
        class="logo-img">

      <h1>Forgot Password</h1>

      <p>
        Enter your username to recover your account
      </p>

    </div>


    <!-- FORM -->

    <form
      (ngSubmit)="onSubmit()"
      class="forgot-form">


      <div class="form-group">

        <label for="username">
          Username
        </label>

        <div class="input-wrap">

          <i class="fas fa-user"></i>

          <input
            id="username"
            type="text"
            [(ngModel)]="formData.username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required>

        </div>

      </div>


      <!-- INFORMATION -->

      <div class="recovery-info">

        <i class="fas fa-envelope"></i>

        <span>
          If the username belongs to a registered Farmer,
          an OTP will be sent to the email address associated
          with the account.
        </span>

      </div>


      <!-- SUBMIT -->

      <button
        type="submit"
        class="submit-btn"
        [disabled]="loading">

        <span *ngIf="!loading">
          <i class="fas fa-paper-plane"></i>
          Send OTP
        </span>

        <span *ngIf="loading">
          <i class="fas fa-spinner fa-spin"></i>
          Checking...
        </span>

      </button>

    </form>


    <!-- BACK TO LOGIN -->

    <div class="back-login">

      <a routerLink="/login">

        <i class="fas fa-arrow-left"></i>

        Back to Login

      </a>

    </div>

  </div>

</div>
