<div class="change-password-page">

    <div class="change-card">

        <div class="logo">

            <img src="img/logo.png" alt="Logo">

            <h2>Create New Password</h2>

            <p>
                Your account is using a temporary password.
                Please create a new secure password before continuing.
            </p>

        </div>

        <form (ngSubmit)="changePassword()">

            <!-- Current Password -->

            <div class="form-group">

                <label>Current Password</label>

                <div class="password-field">

                    <input
                        [type]="showCurrent ? 'text' : 'password'"
                        [(ngModel)]="passwordData.currentPassword"
                        name="currentPassword"
                        placeholder="Enter current password"
                        required>

                    <i
                        class="fa-solid"
                        [class.fa-eye]="!showCurrent"
                        [class.fa-eye-slash]="showCurrent"
                        (click)="showCurrent=!showCurrent">
                    </i>

                </div>

            </div>

            <!-- New Password -->

            <div class="form-group">

                <label>New Password</label>

                <div class="password-field">

                    <input
                        [type]="showNew ? 'text' : 'password'"
                        [(ngModel)]="passwordData.newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        required>

                    <i
                        class="fa-solid"
                        [class.fa-eye]="!showNew"
                        [class.fa-eye-slash]="showNew"
                        (click)="showNew=!showNew">
                    </i>

                </div>

            </div>

            <!-- Confirm Password -->

            <div class="form-group">

                <label>Confirm Password</label>

                <div class="password-field">

                    <input
                        [type]="showConfirm ? 'text' : 'password'"
                        [(ngModel)]="passwordData.confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        required>

                    <i
                        class="fa-solid"
                        [class.fa-eye]="!showConfirm"
                        [class.fa-eye-slash]="showConfirm"
                        (click)="showConfirm=!showConfirm">
                    </i>

                </div>

            </div>

            <button
                type="submit"
                [disabled]="loading">

                <span *ngIf="!loading">
                    Change Password
                </span>

                <span *ngIf="loading">
                    Updating...
                </span>

            </button>

        </form>

    </div>

</div>
