<div class="logs-page">

    <div class="page-header">

        <div>

            <h2>System Activity Logs</h2>

            <p>
                View all activities performed in the system.
            </p>

        </div>

    </div>


    <div class="table-card">

        <div class="table-wrapper">
            <div class="toolbar">

    <input
        type="text"
        placeholder="Search logs..."
        [(ngModel)]="searchTerm">

    <div class="tabs">

        <button
            [class.active]="selectedTab==='All'"
            (click)="selectedTab='All'">

            All

        </button>

        <button
            [class.active]="selectedTab==='SUCCESS'"
            (click)="selectedTab='SUCCESS'">

            Success

        </button>

        <button
            [class.active]="selectedTab==='FAILED'"
            (click)="selectedTab='FAILED'">

            Failed

        </button>

    </div>

</div>
            <table>

                <thead>

                    <tr>

                        <th>Action</th>
                        <th>User</th>
                        <th>Role</th>
                        <th>Description</th>
                        <th>Date & Time</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

<tr *ngFor="let log of filteredLogs">

    <td>{{log.action}}</td>

    <td>{{log.username}}</td>

    <td>{{log.module}}</td>
    <td>{{log.description}}</td>

    <td>

      {{log.createdAt
      | date:'dd MMM yyyy HH:mm'}}

    </td>

    <td>

  <span

      class="status-badge"

      [class.failed]="log.status==='FAILED'">

      {{log.status}}

  </span>

</td>

</tr>

</tbody>
            </table>

        </div>

    </div>

</div>
