<div class="admin-layout">

  <!-- SIDEBAR -->

  <aside class="sidebar"
        [class.collapsed]="sidebarCollapsed"
        [class.mobile-open]="mobileMenuOpen">

    <div class="logo-section">

      <img src="img/logo.png">

      <span *ngIf="!sidebarCollapsed">
        IRIFAMS
      </span>

    </div>

    <nav>

 <a

 *ngFor="let item of menuItems"

 [routerLink]="
    item.route !== 'logout'
    ? item.route
    : null
 "

 (click)="

    item.route==='logout'
    ? logout()
    : closeMobileMenu()

 "

 routerLinkActive="active">

  <i [class]="item.icon"></i>

  <span *ngIf="!sidebarCollapsed">

    {{item.label}}

  </span>

</a>

</nav>

  </aside>

  <div class="sidebar-overlay"
     *ngIf="mobileMenuOpen"
     (click)="mobileMenuOpen=false">

</div>


  <!-- MAIN -->

  <div class="main-content">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="top-left">

        <button class="menu-btn"
                (click)="toggleSidebar()">

          <i class="fas fa-bars"></i>

        </button>

        <div class="search-box">

          <i class="fas fa-search"></i>

          <input
            type="text"
            placeholder="Search anything...">

        </div>

      </div>


      <div class="top-right">

        <button class="icon-btn" routerLink="/admin/notifications">

          <i class="fas fa-bell"></i>

          <span class="badge">

           {{notificationCount}}

           </span>

        </button>

        <button
            class="icon-btn"
            (click)="toggleTheme()">

            <i
                class="fas"
                [ngClass]="
                darkMode
                ? 'fa-sun'
                : 'fa-moon'
            ">

            </i>

        </button>

        <div class="date-box">

          <i class="fas fa-calendar"></i>

          {{today | date:'dd MMM yyyy'}}

        </div>

        <div class="profile">

        <img

        [src]="
        currentUser?.image ||
        'img/default-user.png'
        ">

        <div class="profile-info">

          <h4>

           {{
           currentUser?.fullName
           || 'Administrator'
           }}

           </h4>

           <span>

            {{currentUser?.role}}

            </span>

        </div>

     </div>

      </div>

    </header>

    <!-- CHILD PAGES -->

    <div class="page-content">

      <router-outlet></router-outlet>

    </div>

  </div>

</div>
